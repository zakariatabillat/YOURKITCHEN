<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOURKITCHEN - Carnet de recettes</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

  <header>
    <h1>YOURKITCHEN</h1>
    <p>Le carnet de recettes du Club Cuisine YouCode</p>
  </header>

  <main>
    <form id="form-ajout">
      <h2>Proposer une recette</h2>

      <label for="nom">Nom</label>
      <input type="text" id="nom">
      <p class="erreur" id="erreur-nom"></p>

      <label for="cuisine">Cuisine</label>
      <input type="text" id="cuisine" placeholder="ex : Italian">
      <p class="erreur" id="erreur-cuisine"></p>

      <label for="difficulte">Difficulté</label>
      <select id="difficulte">
        <option value="">-- Choisir --</option>
        <option value="Easy">Facile</option>
        <option value="Medium">Moyenne</option>
        <option value="Hard">Difficile</option>
      </select>
      <p class="erreur" id="erreur-difficulte"></p>

      <label for="temps">Temps de préparation (minutes)</label>
      <input type="number" id="temps">
      <p class="erreur" id="erreur-temps"></p>

      <button type="submit" id="btn-ajouter">Ajouter</button>
    </form>

    <form id="form-recherche">
      <input
        type="search"
        id="champ-recherche"
        placeholder="Rechercher une recette (ex : pizza)"
        aria-label="Rechercher une recette"
      >
      <button type="submit">Rechercher</button>
    </form>

    <p id="message-succes" role="status" hidden></p>

    <div id="chargement" role="status" hidden>
      <div class="spinner"></div>
      <p>Chargement...</p>
    </div>
        <div id="zone-erreur" role="alert" hidden>
      <p id="texte-erreur"></p>
      <button type="button" id="btn-reessayer">Réessayer</button>
    </div>

    <p id="compteur"></p>

    <div id="aucun-resultat" hidden>
      <p>Aucune recette trouvée</p>
      <button type="button" id="btn-toutes">Voir toutes les recettes</button>
    </div>

    <div id="recettes"></div>
  </main>

  <script src="api.js"></script>
  <script src="validation.js"></script>
  <script src="affichage.js"></script>
  <script src="app.js"></script>
</body>
</html>
